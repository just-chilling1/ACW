<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embed test — host website</title>
  <style>
    body { font-family: sans-serif; background: #eef2f7; margin: 0; padding: 40px; }
    h1 { color: #111; }
  </style>
</head>
<body>
  <h1>Pretend external website</h1>
  <p>The AI CashWave specialist popup should appear over this page when eligible.</p>
  <p id="status">iframe status: hidden</p>

  <iframe
    id="cashtap-specialist-popup"
    src="/embed/specialist-popup?preview=1"
    title="AI CashWave Start-Up Specialist"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:999999;display:none;background:transparent"
    allowtransparency="true"
  ></iframe>
  <script>
    (function () {
      var frame = document.getElementById("cashtap-specialist-popup");
      var status = document.getElementById("status");
      window.addEventListener("message", function (e) {
        var d = e.data;
        if (d && d.type === "cashtap-specialist-popup") {
          frame.style.display = d.open ? "block" : "none";
          status.textContent = "iframe status: " + (d.open ? "visible" : "hidden");
        }
      });
    })();
  </script>
</body>
</html>
