name: instant-income-speed
description: >
  Prioritized Instant Income optimization: (1) minimize kit build wall time,
  (2) keep/improve content usefulness gates, (3) reduce UX friction to first copy.
  Phase focus starts with build speed; quality and UX follow in short loops.

metric:
  primary:
    type: hard
    name: estimated_wall_seconds
    direction: minimize
    target: 25
  degenerate_gates:
    - name: structural_ok
      check: "== 1"
      description: Kit pipeline still produces posts, replies, hooks, and recommendations
    - name: min_posts
      check: ">= 8"
      description: Enough posts for multi-cycle workflow
    - name: min_replies
      check: ">= 6"
      description: Enough reply assets for smart-reply coverage
    - name: llm_waves
      check: "<= 6"
      description: Do not increase sequential LLM wave count vs baseline
  diagnostics:
    - name: llm_waves
    - name: db_insert_round_trips
    - name: parallel_content_stages
    - name: redundant_analyze_risk
    - name: ux_step_count

measurement:
  command: "node scripts/eval/measure-instant-kit.mjs"
  timeout_seconds: 60
  working_directory: "."
  stability:
    mode: once
    noise_threshold: 0.5

scope:
  mutable:
    - "src/lib/instant/"
    - "src/app/api/instant/"
    - "src/app/instant/"
    - "src/components/instant/"
  immutable:
    - "scripts/eval/measure-instant-kit.mjs"
    - "src/lib/llm.ts"
    - "src/lib/api-auth.ts"

execution:
  mode: serial
  backend: worktree
  max_concurrent: 1

parallel:
  port_strategy: none
  shared_files: []

dependencies:
  approved: []

constraints:
  - "Do not call live LLM or Supabase in the measurement harness"
  - "Preserve Instant Income user-facing copy/paste workflow (Post → Reply → Post again → Next/All done)"
  - "Do not remove affiliate safety rules"
  - "Batch DB writes must still return asset rows with ids for recommendations"
  - "Keep prior Instant Income bugfixes (dedupe offers, smart reply intent, pinned posts, next-step loop)"

stopping:
  max_iterations: 4
  max_hours: 1
  plateau_iterations: 2
  target_reached: true

max_runner_up_merges_per_batch: 0
